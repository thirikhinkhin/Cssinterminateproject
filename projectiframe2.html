<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table,td,th{border:2px solid darkolivegreen;}
    </style>
</head>
<body>
    <h1> Lesson Preview HTML Resources</h1>
    <p>Use rows and cells to organize tabular information</p>
    <table>
        <tr>
            <th>Element</th>
            <th>purpose</th>
        </tr>
        <tr>
            <td>tr</td>
            <td>Table row</td>
        </tr>
        <tr>
            <td>td</td>
            <td>Table Data cell</td>
        </tr>
    </table>
</body>
</html>
