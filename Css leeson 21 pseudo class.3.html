<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class 3 </title>
    <style>
        input:focus{background-color: cornflowerblue;}
        input:enabled{background-color: yellow;}
       
    </style>
</head>
<body>
    <form>
        <label for="name">Name</label>
        <input type="name" name="name" id="name" placeholder="please enter full name"><br>
        
        
        <label for="email">Email</label>
        <input type="email" name="email" id="email" placeholder="please enter your email"><br>
        
        
        <label for="pass">Password</label>
        <input type="pass" name="pass" id="pass" placeholder="please enter your password"><br>
        
        
        <label for="rep">Retype your password</label>
        <input type="rep" name="name" id="name" placeholder="please enter full name"><br>
        
        <label for="gen">Genter</label>
        <input type="radio" name="gen" id="male"/><label for="male">Male</label>
        <input type="radio" name="gen" id="female"/><label for="female">Female</label><br>        

        <label for="rev">Please Enter Your Review</label>
       <textarea name="rev" id="rev" placeholder="please enter your review"></textarea>
    </form>
</body>
</html>
