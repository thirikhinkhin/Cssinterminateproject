<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo class</title>
    <style>
        img{width:250px;height:250px;margin: auto;display:block;}
        img:hover{border: 8px solid gold; border-radius:150px;}
        .box{width: 100px;height: 100px;background-color: blueviolet;margin: auto;}
        .box:hover{width:250px;height:250px;margin: auto;text-align:center;line-height: 250px;}
    </style> 
</head>
<body>
    <img src="cat.jpg">
    <hr>
    <div class="box">
        hello
    </div>
</body>
</html>
