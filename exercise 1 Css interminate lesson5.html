<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interminate Css Exercise 1</title>
    <style>
        ol{list-style-type: none;padding:20px;}
        li{background-color:yellow;width:60px;height:20px;padding: 10px 100px 10px ;border:4px solid green;;margin-left:90px;display:inline-block;}
        li a{color:black;text-decoration: none;}
        img{width:300px;height:300px;display: block;margin:auto;margin-bottom: 30px;}
        body{border:6px solid red;}
        hr{height: 5px;background-color:orange}
        .img1,.img2,.img3{width:300px;height:300px;display:inline-block;margin: 100px;}
    </style>
</head>
<body>
    
        <ol>
            <li><a href="#home">Home</a></li>
            <li><a href="#About">About</a></li>
            <li><a href="#service">Service</a></li>
            <li><a href="#Contact">Contact</a></li>
        </ol>

        <div id="div2">
            <img src="cat.jpg">
            <img src="dog-1.jpg">
        </div>
        <hr>
            
            <img src="cat.jpg" class="img1">
            <img src="dog-1.jpg" class="img2">
            <img src="dog.jpg" class="img3">
           
</body>
</html>
