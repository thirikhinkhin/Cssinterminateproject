<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient</title>
    <style>
        
        #div1{width: 800px;height:400px;margin: auto;background-image: linear-gradient(to top left, green,purple,blue,red,orange,black,yellow);}
        #mydiv{width:800px;height:400px;margin:auto;background-image: radial-gradient(circle,green,purple,orange,yellow);}
    </style>
</head>
<body>
    <h1>Linear gradient</h1>
    <div id="div1"></div>

    <h1>Radial gradient</h1>
    <div id="mydiv"></div>
</body>
</html>
