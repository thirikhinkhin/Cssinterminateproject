<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML form</title>
    <style>
        label{color:rgb(70, 101, 163)}
        form{border:2px solid green;width:1400px;padding:10px;}
        input{border:2px solid darkorange;width: 150px;;}
        h1{text-align: center;}
        select{border-color: darkorange; width:200px;}
        
    </style>
</head>
<body>
    <h1>HTML form</h1>
    
    <form action="">

        <label for="user_name">User Name or E-mail Address - </label> 
        <input type="text" name="user_name" id="user_name" placeholder="Enter your name or email address"><hr>

        <label for="user_password">User password</label>
        <input type="password" name="user_password" id="user_password" placeholder="Enter your Password"><hr>

        <label for="gender">Gender - </label>
        <input type="radio" name="gender" id="male"/><label for="male">Male</label>
        <input type="radio" name="gender" id="female"/><label for="female">Female</label><hr>

        <label for="hobby">Chose your hobby</label>
        <input type="checkbox" name="hobby" id="reading"><label for="reading">Reading</label>
        <input type="checkbox" name="hobby" id="singing"><label for="singing">Singing</label>
        <input type="checkbox" name="hobby" id="Lisening to music"><label for="Lisening to music">Lisening to music</label>
        <input type="checkbox" name="hobby" id="doing yuga"><label for="doing yuga">doing yuga</label>
        <input type="checkbox" name="hobby" id="doing exercise"><label for="doing exercise">doing exercise</label><hr>

        <label for="feedback">Write your feedback</label>
        <textarea name="feedback" id="feedback" row="30" cols="30" placeholder="Please write your feedback"></textarea><hr>

        <labeL for="choose_village">Choose your country</labeL>
        <select name="choose_village" id="choose_village" size="default">
            <option vlaue="Myanmar">Myanmar</option>
            <option vakue="Bangkok">Bangkok</option>
            <option value="Thai">Thai</option>
            <option value="Korea">Korea</option>
            <option value="UK">UK</option>
            <option value="Japan">Japan</option>
            <option value="Africa">Africa</option>
        </select><hr>
        <label for="township">Choose your township</label>
        <select name="township" id="township">
            <optgroup label="yangon">
            <option>Bahan</option>
            <option>Hlaing</option>
            </optgroup>
            <optgroup label="Shan">
            <option>Bago</option>
            <option>Sangaung</option>
            </optgroup>
            <optgroup label="Kachin">
            <option>Setwe</option>
            <option>Nay Pyi Taw</option>
            </optgroup>
        </select><hr>

        <input type="submit" value="Register"> <hr>

        <button type="button">Submit</button>
        <button type="reset">Reset</button> <hr>

        <label for="nat">Nationality</label>
        <input type="text" name="nat" id="nat" list="nati">
        <datalist id="nati">
            <option value="burmese">
            <option value="japanese">
            <option value="phipallinese">       
        </datalist>
        
    </form>

    <hr>

    <h1>Form -2</h1>

    <form action="">


        <label for="name">Name</label>
        <input type="text" name="name" id="name" placeholder="Plese write your name"><br><br>



        <label for="email">E-mail</label>
        <input type="email" name="email" id="email" placeholder="Plese write your email"><br><br>



        <label for="password">Password</label>
        <input type="password" name="password" id="password" placeholder="Plese write your password"><br><br>



        <button type="submit">Save</button>
    </form><hr>



    <h1>Input Type values</h1>

    <form>
        <input type="button"><br><br>
        <input type="checkbox"><br><br>
        <input type="color"><br><br>
        <input type="date"><br><br>
        <input type="datetime-local"><br><br>
        <input type="email"><br><br>
        <input type="file"><br><br>
        <input type="hidden"><br><br>
        <input type="image"><br><br>
        <input type="month"><br><br>
        <input type="number"><br><br>
        <input type="password"><br><br>
        <input type="radio"><br><br>
        <input type="range"><br><br>
        <input type="reset"><br><br>
        <input type="search"><br><br>
        <input type="submit"><br><br>
        <input type="tel"><br><br>
        <input type="text"><br><br>
        <input type="time"><br><br>
        <input type="url"><br><br>
        <input type="week"><br><br>
    </form>



</body>
</html>
